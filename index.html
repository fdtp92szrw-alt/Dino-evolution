<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dino Evolution</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;background:linear-gradient(#77b9cf 0 45%,#6da34c 45% 100%)}
.ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.card{background:#102019d9;border:1px solid #ffffff30;border-radius:14px;padding:9px 11px;backdrop-filter:blur(8px);box-shadow:0 4px 18px #0005}.stats{font-size:13px;line-height:1.45}.xp{height:7px;background:#ffffff30;border-radius:9px;overflow:hidden;width:180px;margin-top:5px}.xp i{display:block;height:100%;background:#ffd54a;width:0}.btns{position:absolute;bottom:18px;right:15px;display:grid;grid-template-columns:70px 70px;gap:10px;pointer-events:auto}.btn{height:70px;border-radius:50%;border:1px solid #ffffff44;background:#17251dcc;color:white;font-size:25px;font-weight:700}.btn:active{transform:scale(.94);background:#284330}.attack{grid-column:2;background:#9b3b2ecc}.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,390px);background:#122019f5;border:1px solid #ffffff35;border-radius:20px;padding:18px;display:none;pointer-events:auto}.panel h2{margin:0 0 8px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff18}.panel button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:12px;background:#e0a83b;color:#111;font-weight:800}.hint{position:absolute;bottom:12px;left:14px;font-size:12px;opacity:.75}.tag{font-size:11px;opacity:.75}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui">
 <div class="top">
  <div class="card stats"><b>🦖 DINO EVOLUTION</b><br>Уровень <span id="lvl">1</span> · XP <span id="xpt">0/100</span><div class="xp"><i id="bar"></i></div><span class="tag">❤️ <span id="hp">100</span> · ⚔️ <span id="atk">12</span> · 🏃 <span id="spd">3</span></span></div>
  <div class="card">🏆 <span id="trophies">0</span></div>
 </div>
 <div class="hint">Слева/свайп — движение · 🦷 — атака · ⚙️ — эволюция</div>
 <div class="btns">
   <button class="btn" id="evo">🧬</button><button class="btn attack" id="hit">🦷</button>
 </div>
</div>
<div class="panel" id="panel"><h2>🧬 Эволюция</h2><p>Улучшай части тела за трофеи.</p>
 <div class="row">🦷 Мощная челюсть <b>+4 ⚔️ · 3🏆</b></div>
 <div class="row">🦵 Сильные ноги <b>+1 🏃 · 3🏆</b></div>
 <div class="row">🛡️ Броня <b>+20 ❤️ · 4🏆</b></div>
 <button data-up="atk">Улучшить челюсть</button><button data-up="spd">Улучшить ноги</button><button data-up="hp">Улучшить броню</button><button id="close">Закрыть</button>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
let d={x:W*.5,y:H*.58,r:30,dir:0,hp:100,max:100,atk:12,spd:3,lvl:1,xp:0,t:0}, enemies=[], trophies=0, keys={}, joy={x:0,y:0}, last=0;
function spawn(){let a=Math.random()*Math.PI*2, rr=Math.max(W,H)*.65;enemies.push({x:W/2+Math.cos(a)*rr,y:H*.58+Math.sin(a)*rr,r:24,hp:25+ d.lvl*7,max:25+d.lvl*7,spd:1+Math.random(),hit:0})}
for(let i=0;i<5;i++)spawn();
function xp(n){d.xp+=n;while(d.xp>=100){d.xp-=100;d.lvl++;d.max+=12;d.hp=d.max;d.atk+=2;d.spd+=.15}ui()}
function ui(){lvl.textContent=d.lvl;xpt.textContent=`${d.xp}/100`;bar.style.width=d.xp+'%';hp.textContent=Math.round(d.hp);atk.textContent=Math.round(d.atk);spd.textContent=d.spd.toFixed(1);trophies.textContent=trophies}
function attack(){for(let e of enemies){let dx=e.x-d.x,dy=e.y-d.y;if(Math.hypot(dx,dy)<d.r+e.r+38){e.hp-=d.atk;e.hit=.15;if(e.hp<=0){trophies++;xp(25);spawn();ui()}}}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;
 let vx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,vy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y;let l=Math.hypot(vx,vy)||1;
 d.x+=vx/l*d.spd*60*dt;d.y+=vy/l*d.spd*60*dt;d.x=Math.max(35,Math.min(W-35,d.x));d.y=Math.max(100,Math.min(H-45,d.y));
 x.clearRect(0,0,W,H);
 // simple prehistoric landscape
 x.fillStyle='#6fa34d';x.fillRect(0,H*.45,W,H*.55);
 for(let i=0;i<22;i++){let px=(i*173)%W,py=H*.48+(i*83)% (H*.48);x.fillStyle='#47743b';x.beginPath();x.arc(px,py,18,0,7);x.fill()}
 for(let e of enemies){let dx=d.x-e.x,dy=d.y-e.y,dist=Math.hypot(dx,dy);if(dist>45){e.x+=dx/dist*e.spd*35*dt;e.y+=dy/dist*e.spd*35*dt}else if(e.hit<=0)d.hp-=7*dt;e.hit-=dt;
  x.save();x.translate(e.x,e.y);x.fillStyle='#9b6b42';x.beginPath();x.ellipse(0,4,27,17,0,0,7);x.fill();x.fillStyle='#70472e';x.beginPath();x.arc(22,-4,11,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(25,-7,3,0,7);x.fill();x.restore();
 }
 x.save();x.translate(d.x,d.y);x.scale(d.dir||1,1);x.fillStyle='#3d8c55';x.beginPath();x.ellipse(0,4,36,22,0,0,7);x.fill();x.beginPath();x.moveTo(-28,5);x.lineTo(-65,-8);x.lineTo(-32,16);x.fill();x.fillStyle='#27613b';x.beginPath();x.arc(28,-7,17,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(34,-11,4,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(35,-11,2,0,7);x.fill();x.strokeStyle='#285f39';x.lineWidth=7;for(let q of [-18,18]){x.beginPath();x.moveTo(q,15);x.lineTo(q-4,35);x.stroke()}x.restore();
 if(d.hp<=0){d.hp=d.max*.6;trophies=Math.max(0,trophies-1);ui()}
 ui();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')attack()});addEventListener('keyup',e=>keys[e.key]=false);
let sx=0,sy=0;addEventListener('touchstart',e=>{if(e.target.classList.contains('btn'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY});addEventListener('touchmove',e=>{if(e.target.classList.contains('btn'))return;let t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy,l=Math.hypot(dx,dy)||1;joy.x=Math.max(-1,Math.min(1,dx/80));joy.y=Math.max(-1,Math.min(1,dy/80));if(Math.abs(dx)>10)d.dir=dx>0?1:-1});addEventListener('touchend',e=>{joy.x=joy.y=0});
hit.onclick=attack;evo.onclick=()=>panel.style.display='block';close.onclick=()=>panel.style.display='none';
document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let k=b.dataset.up,cost=k==='hp'?4:3;if(trophies<cost)return alert('Нужно больше трофеев');trophies-=cost;if(k==='hp'){d.max+=20;d.hp=d.max}else if(k==='atk')d.atk+=4;else d.spd+=1;ui()});ui();
</script>
</body></html>
